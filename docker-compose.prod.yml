services:
  mongodb:
    image: mongo:7.0
    container_name: airost-mongodb-prod
    restart: always
    volumes:
      - mongo_data_prod:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    image: ghcr.io/airost-utm-org/airost-intranet-server:latest
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: airost-server-prod
    restart: always
    ports:
      - "4000:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/airost_intranet}
      - REACT_APP_URL=${REACT_APP_URL:-}
      - PASSPORT_SECRET=${PASSPORT_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-${CLIENT_ID:-}}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-${CLIENT_SECRET:-}}
      - CREDENTIALS=${CREDENTIALS:-{}}
      - CALENDAR_ID=${CALENDAR_ID:-none}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
    depends_on:
      mongodb:
        condition: service_healthy

  client:
    image: ghcr.io/airost-utm-org/airost-intranet-client:latest
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: airost-client-prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mongo_data_prod:
